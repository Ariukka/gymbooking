# Google OAuth2
# Authorized redirect URI (Google Console): http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email

# Frontend redirect target after Google login success (JWT-based)
app.frontend.oauth2-success-url=${FRONTEND_OAUTH2_SUCCESS_URL:http://localhost:3000/login/callback}

# OAuth2 success response mode: jwt | cookie
app.frontend.oauth2-success-mode=${FRONTEND_OAUTH2_SUCCESS_MODE:jwt}

# Frontend redirect whitelist (comma-separated origins or prefixes)
app.frontend.oauth2-redirect-whitelist=${FRONTEND_OAUTH2_REDIRECT_WHITELIST:http://localhost:3000}

# CORS whitelist (comma-separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
